# Checks every push and pull request: the TypeScript of the app and the
# agent, the tests of the engine, the agent and the voice-over, and the
# app shell's Rust tests. On macOS, the only platform Shotloop ships for.
# The agent's tests render stills as the app does, with the runner's
# Google Chrome and ffmpeg (installed here); no test needs a speech
# model.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: brew install ffmpeg
      - run: pnpm typecheck
      - run: pnpm test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test
