<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 30 140 140">
  <!-- Shotloop: a forward play and a back play, woven like two links -->
  <defs>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset=".5" stop-color="#fb7185"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <clipPath id="left"><rect width="100" height="200"/></clipPath>
    <clipPath id="right"><rect x="100" width="100" height="200"/></clipPath>
    <!-- Over on the right, the back play cuts the forward one; over on the left, the other way round -->
    <mask id="cutA" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><path clip-path="url(#right)" d="M152 68Q152 56 141.35 61.53L58.65 104.47Q48 110 58.65 115.53L141.35 158.47Q152 164 152 152Z" stroke="#000" stroke-width="7" stroke-linejoin="round"/></mask>
    <mask id="cutB" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><path clip-path="url(#left)" d="M48 48Q48 36 58.65 41.53L141.35 84.47Q152 90 141.35 95.53L58.65 138.47Q48 144 48 132Z" stroke="#000" stroke-width="7" stroke-linejoin="round"/></mask>
  </defs>
  <path mask="url(#cutA)" fill="url(#cool)" d="M48 48Q48 36 58.65 41.53L141.35 84.47Q152 90 141.35 95.53L58.65 138.47Q48 144 48 132Z"/>
  <path mask="url(#cutB)" fill="url(#warm)" d="M152 68Q152 56 141.35 61.53L58.65 104.47Q48 110 58.65 115.53L141.35 158.47Q152 164 152 152Z"/>
</svg>
