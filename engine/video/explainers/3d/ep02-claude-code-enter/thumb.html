<!doctype html>
<!--
  02 · Cover (1080×1920), rendered by engine thumb.mjs: the network shot
  (a raw frame, no captions) under the hook. The final render's frame is
  used when it exists, else the draft's. Text stays inside the 3:4
  profile-grid crop (y 240–1680).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;900&family=JetBrains+Mono:wght@500&display=block"
    />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0f19;
        color: #fff;
        font-family: Archivo, sans-serif;
      }
      #bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 70%;
      }
      #shade {
        position: absolute;
        inset: 0 0 auto;
        height: 1000px;
        background: linear-gradient(#0b0f19 55%, rgba(11, 15, 25, 0));
      }
      #bar {
        position: absolute;
        left: 0;
        top: 0;
        width: 60%;
        height: 12px;
        background: #ffb340;
      }
      #chrome {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 150px;
        display: flex;
        justify-content: space-between;
        font: 500 30px 'JetBrains Mono', monospace;
        letter-spacing: 0.08em;
        color: #d6dcea;
      }
      #main {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 330px;
        border-left: 12px solid #ffb340;
        padding-left: 40px;
      }
      h1 {
        font-weight: 900;
        font-size: 128px;
        line-height: 0.95;
        letter-spacing: -0.045em;
      }
      h1 em {
        font-style: normal;
        color: #ffb340;
      }
      p {
        margin-top: 36px;
        font-weight: 900;
        font-size: 72px;
        line-height: 1.02;
        letter-spacing: -0.035em;
        color: #c9d1e2;
      }
    </style>
  </head>
  <body>
    <img id="bg" alt="" />
    <div id="shade"></div>
    <div id="bar"></div>
    <div id="chrome"><span>02 — CLAUDE CODE</span><span>OLIVERZ.DEV</span></div>
    <div id="main">
      <h1>You press<br /><em>Enter.</em></h1>
      <p>Where does your<br />prompt go?</p>
    </div>
    <script>
      // The model shot at 29.6 s (frame 889): final render, else draft
      const img = document.getElementById('bg')
      const loaded = new Promise(resolve => {
        img.onload = resolve
        img.onerror = () => {
          img.onerror = resolve
          img.src = 'out/frames-draft/00889.png'
        }
      })
      img.src = 'out/frames/00889.png'
      window.ready = Promise.all([document.fonts.ready, loaded])
    </script>
  </body>
</html>
