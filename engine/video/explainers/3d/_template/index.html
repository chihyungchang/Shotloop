<!doctype html>
<!--
  3D explainer template. Step 4 (code) of the 3D track: copy.md,
  script.md, storyboard.md and scene.md come first. Copy this folder to
  start. 9:16 at 720×1280 CSS px; window.render(t) draws the frame at t
  seconds (three.js scene + DOM captions) for engine/video/record.mjs.
  ?play previews in real time, ?t=12.3 shows one frame.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=block"
    />
    <script type="importmap">
      {
        "imports": {
          "three": "../../../../../node_modules/three/build/three.module.js",
          "three/addons/": "../../../../../node_modules/three/examples/jsm/"
        }
      }
    </script>
    <style>
      /* The palette: pick per topic in storyboard.md. --accent is the
         point / good answer, --warn only for something going wrong.
         The scene reads these too, so this block sets both. */
      :root {
        --bg: #05070d;
        --fg: #e8eef8;
        --muted: #8a93a6;
        --accent: #f5c542;
        --warn: #ff4d55;
        --sans: Archivo, system-ui, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 720px;
        height: 1280px;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
      }
      canvas {
        position: absolute;
        inset: 0;
      }
      .mono {
        font-family: var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .display {
        font-weight: 900;
        letter-spacing: -0.035em;
        line-height: 0.95;
      }
      /* Safe area: x 40–620, y 110–1030 */
      .safe {
        position: absolute;
        left: 44px;
        right: 100px;
      }
      #chrome {
        position: absolute;
        left: 44px;
        right: 100px;
        top: 96px;
        display: flex;
        justify-content: space-between;
        font-size: 18px;
        color: var(--muted);
        z-index: 5;
      }
      #progress {
        position: absolute;
        left: 0;
        top: 0;
        height: 8px;
        background: var(--accent);
        z-index: 5;
      }
      .cap {
        position: absolute;
        z-index: 4;
      }
      #title {
        top: 250px;
        font-size: 84px;
      }
    </style>
  </head>
  <body>
    <div id="progress"></div>
    <div id="chrome" class="mono"><span>NN — Topic</span><span>oliverz.dev</span></div>
    <h1 class="safe display cap" id="title">Hook line goes here</h1>

    <script type="module">
      import * as THREE from 'three'
      import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
      import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
      import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
      import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'

      const $ = id => document.getElementById(id)
      const clamp = x => Math.min(1, Math.max(0, x))
      const rise = (t, a, d = 0.35) => 1 - Math.pow(1 - clamp((t - a) / d), 3)
      const ease = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)
      const lift = (el, p, dy = 40) => {
        el.style.opacity = p
        el.style.transform = `translateY(${(1 - p) * dy}px)`
      }
      // Seeded random: draw at setup only, never inside render(t)
      let seed = 7
      const rng = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
      const css = name => new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue(name).trim())

      const BAR = 2.4 // 100 bpm; keep in step with music.json
      const DURATION = 16 * BAR

      // Renderer at the page's device pixel ratio (1.5 when recording)
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
      renderer.setPixelRatio(window.devicePixelRatio)
      renderer.setSize(720, 1280)
      document.body.prepend(renderer.domElement)

      const scene = new THREE.Scene()
      // scene.background, not setClearColor: through the composer the
      // clear colour is converted twice and comes out grey
      scene.background = css('--bg')
      scene.fog = new THREE.Fog(css('--bg'), 8, 30)
      const camera = new THREE.PerspectiveCamera(40, 720 / 1280, 0.1, 200)
      scene.add(new THREE.AmbientLight(0xffffff, 0.35))
      const key = new THREE.DirectionalLight(0xffffff, 2.2)
      key.position.set(4, 6, 8)
      scene.add(key)

      // Example props: replace with the objects in scene.md
      const boxes = []
      for (let i = 0; i < 5; i++) {
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(1, 1, 1),
          new THREE.MeshStandardMaterial({ color: css('--accent'), roughness: 0.4 })
        )
        m.position.set((i - 2) * 1.6, (rng() - 0.5) * 1.5, 0)
        boxes.push(m)
        scene.add(m)
      }

      // Camera keyframes from scene.md: [t, position, target, fov]
      const CAMERA = [
        [0, [0, 1, 12], [0, 0, 0], 40],
        [8 * BAR, [4, 2, 8], [0, 0, 0], 36],
        [16 * BAR, [0, 0, 6], [0, 0, 0], 32]
      ]
      const v = (a, b, k) => a.map((x, i) => x + (b[i] - x) * k)
      function cameraAt(t) {
        let i = CAMERA.findIndex(([kt]) => kt > t)
        if (i === -1) i = CAMERA.length - 1
        if (i === 0) i = 1
        const [t0, p0, l0, f0] = CAMERA[i - 1]
        const [t1, p1, l1, f1] = CAMERA[i]
        const k = ease(clamp((t - t0) / (t1 - t0)))
        camera.position.set(...v(p0, p1, k))
        camera.fov = f0 + (f1 - f0) * k
        camera.updateProjectionMatrix()
        camera.lookAt(...v(l0, l1, k))
      }

      const composer = new EffectComposer(renderer)
      composer.addPass(new RenderPass(scene, camera))
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(720, 1280), 0.35, 0.5, 0.65))
      composer.addPass(new OutputPass())

      function render(t) {
        cameraAt(t)
        boxes.forEach((b, i) => {
          b.rotation.set(t * 0.4 + i, t * 0.6, 0)
        })
        $('progress').style.width = `${(t / DURATION) * 100}%`
        lift($('title'), rise(t, 0.1))
        composer.render()
      }

      window.DURATION = DURATION
      window.render = render
      window.ready = document.fonts.ready

      const params = new URLSearchParams(location.search)
      if (params.has('play')) {
        const start = performance.now()
        const tick = () => {
          render(((performance.now() - start) / 1000) % DURATION)
          requestAnimationFrame(tick)
        }
        tick()
      } else render(Number(params.get('t') ?? 0))
    </script>
  </body>
</html>
