[package]
name = "shotloop"
version = "0.1.0"
description = "Make short videos from code, one shot at a time"
authors = ["Oliver Zhang"]
edition = "2021"

[lib]
name = "shotloop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
