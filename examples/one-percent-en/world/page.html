<!doctype html>
<!--
  World of "1% better every day: what's a year worth?": the paper stage every shot draws
  on, at 1280×720 CSS px (rendered at 1.5x). Shots mount their own scene
  into #stage with kit.scene() and set every moving property from t, so
  any frame renders alone. Charts are inline SVG in stage coordinates.
  Layout grid: 80 px side margins, header at y 40, footer at y 676.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --paper: #f4efe6;
        --ink: #17150f;
        --muted: #7a7266;
        --faint: #a39b8e;
        --rule: rgba(23, 21, 15, 0.14);
        --grid: rgba(23, 21, 15, 0.075);
        --green: #0d6b47;
        --green-soft: rgba(13, 107, 71, 0.1);
        --red: #b5483c;
        --red-soft: rgba(181, 72, 60, 0.1);
        --sans: -apple-system, 'Helvetica Neue', 'PingFang SC', sans-serif;
        --num: -apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', sans-serif;
        --mono: 'SF Mono', ui-monospace, Menlo, monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1280px; height: 720px; overflow: hidden;
        background: var(--paper); color: var(--ink); font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      /* Faint paper grain: two soft radial washes, no images */
      body::before {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(120% 90% at 15% 0%, rgba(255, 255, 255, 0.45), transparent 60%),
          radial-gradient(90% 80% at 100% 100%, rgba(120, 100, 70, 0.07), transparent 60%);
      }
      .mono { font-family: var(--mono); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
      .num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
      .green { color: var(--green); }
      .red { color: var(--red); }
      .muted { color: var(--muted); }
      sup.exp { font-size: 0.32em; vertical-align: top; position: relative; top: 0.12em; margin-left: 0.04em; letter-spacing: 0; font-weight: 700; }
      .abs { position: absolute; }
      .headline { font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; }

      #head { position: absolute; left: 80px; right: 80px; top: 34px; height: 24px; display: flex; justify-content: space-between; align-items: center; }
      #head .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 10px; vertical-align: 1px; }
      #headRule { position: absolute; left: 80px; right: 80px; top: 66px; height: 1px; background: var(--rule); }
      #foot { position: absolute; left: 80px; right: 80px; top: 668px; display: flex; justify-content: space-between; }
      #track { position: absolute; left: 80px; right: 80px; top: 656px; height: 1px; background: var(--rule); }
      #bar { position: absolute; left: 0; top: -1px; height: 3px; background: var(--ink); }
      #stage { position: absolute; inset: 0; }
      svg.plot { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; overflow: visible; }
      svg text { font-family: var(--mono); font-size: 12px; fill: var(--muted); letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="head" class="mono"><span id="headL"></span><span id="headR"></span></div>
    <div id="headRule"></div>
    <div id="stage"></div>
    <div id="track"><div id="bar"></div></div>
    <div id="foot" class="mono"><span id="footL"></span><span id="footR"></span></div>
    <script>
      const FILM = 26 // seconds, the sum of shotloop.json durations
      const SHOTS = 6
      const $ = id => document.getElementById(id)
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
      const lerp = (a, b, p) => a + (b - a) * p
      const ease = {
        out: p => 1 - Math.pow(1 - clamp(p), 3),
        outQuint: p => 1 - Math.pow(1 - clamp(p), 5),
        inOut: p => { p = clamp(p); return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 }
      }
      // 0 → 1 over [a, a + d], eased
      const rise = (t, a, d = 0.6, f = ease.outQuint) => f((t - a) / d)
      // Fade and lift an element by p (0 hidden, 1 in place)
      const lift = (el, p, dy = 18) => {
        el.style.opacity = p
        el.style.transform = `translateY(${(1 - p) * dy}px)`
      }
      // A wipe from the left, for rules and labels
      const wipe = (el, p) => { el.style.clipPath = `inset(-20% ${(1 - p) * 100}% -20% 0)` }
      // Numbers with grouping and fixed decimals, e.g. fmt(1480.6, 0) → 1,481
      const fmt = (x, d = 2) => x.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d })

      // Header, footer and the film progress bar, drawn by every shot
      function frame(t, { index, start, foot = '', footR = '' }) {
        $('headL').innerHTML = '<i class="dot"></i>Compounding · 1% a day'
        $('headR').textContent = `${String(index).padStart(2, '0')} / ${String(SHOTS).padStart(2, '0')}`
        $('footL').textContent = foot
        $('footR').textContent = footR
        $('bar').style.width = `${clamp((start + t) / FILM) * 100}%`
      }

      // Mount a shot's scene once; later frames only restyle it
      function scene(key, html) {
        const s = $('stage')
        if (s.dataset.scene !== key) {
          s.innerHTML = html
          s.dataset.scene = key
        }
        return s
      }

      // A chart box in stage px with linear or log y. Returns scales and
      // SVG builders; everything is plain markup strings.
      function chart({ x, y, w, h, x0 = 0, x1 = 365, y0, y1, log = false }) {
        const ty = log ? Math.log10 : v => v
        const sx = d => x + ((d - x0) / (x1 - x0)) * w
        const sy = v => y + h - ((ty(v) - ty(y0)) / (ty(y1) - ty(y0))) * h
        // Hairline grid, ticks and labels; p reveals it left to right
        const axes = ({ xt, yt, yfmt = v => v, xfmt = v => v, xlabel = '', ylabel = '' }) => {
          let s = ''
          for (const v of yt) {
            const Y = sy(v).toFixed(1)
            s += `<line x1="${x}" x2="${x + w}" y1="${Y}" y2="${Y}" stroke="rgba(23,21,15,0.08)" />`
            s += `<text x="${x - 12}" y="${+Y + 4}" text-anchor="end">${yfmt(v)}</text>`
          }
          for (const d of xt) {
            const X = sx(d).toFixed(1)
            s += `<line x1="${X}" x2="${X}" y1="${y + h}" y2="${y + h + 6}" stroke="rgba(23,21,15,0.45)" />`
            s += `<text x="${X}" y="${y + h + 24}" text-anchor="middle">${xfmt(d)}</text>`
          }
          s += `<line x1="${x}" x2="${x + w}" y1="${y + h}" y2="${y + h}" stroke="#17150f" stroke-width="1.2" />`
          if (xlabel) s += `<text x="${x + w}" y="${y + h + 46}" text-anchor="end">${xlabel}</text>`
          if (ylabel) s += `<text x="${x - 12}" y="${y - 18}" text-anchor="end">${ylabel}</text>`
          return s
        }
        // Path of f over days [0, d], sampled finely
        const path = (f, d, n = 240) => {
          let s = ''
          for (let i = 0; i <= n; i++) {
            const day = (d * i) / n
            s += `${i ? 'L' : 'M'}${sx(day).toFixed(2)},${sy(f(day)).toFixed(2)}`
          }
          return s
        }
        // The same path closed down to the baseline, for a soft fill
        const area = (f, d, base) => `${path(f, d)}L${sx(d).toFixed(2)},${sy(base).toFixed(2)}L${sx(0)},${sy(base).toFixed(2)}Z`
        return { x, y, w, h, sx, sy, axes, path, area }
      }

      // One compounding curve drawn over 365 days with a live counter
      // (shots 02 and 03). o: { key, base, color, y1, yt, yfmt, digits,
      // counter: css position, note, mark: { day, label }, draw: [a, b] }
      function curveShot(t, o) {
        const f = d => Math.pow(o.base, d)
        const c = chart({ x: 150, y: 150, w: 990, h: 430, y0: 0, y1: o.y1 })
        const s = scene(o.key, `
          <div class="abs mono" id="kick" style="left:80px; top:100px">${o.kicker}</div>
          <svg class="plot" viewBox="0 0 1280 720">
            <g id="grid">${c.axes({ xt: [0, 100, 200, 300, 365], yt: o.yt, yfmt: o.yfmt, xlabel: 'Days →' })}</g>
            <path id="area" fill="var(--${o.color}-soft)" />
            <g id="mark"></g>
            <path id="line" fill="none" stroke="var(--${o.color})" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
            <g id="tip"></g>
          </svg>
          <div class="abs" id="counter" style="${o.counter}">
            <div class="num" style="font-size:44px; font-weight:700">${o.base.toFixed(2)}<sup class="exp" id="exp">365</sup></div>
            <div class="num ${o.color}" id="value" style="font-size:124px; font-weight:700; line-height:1; margin-top:6px"></div>
            <div id="note" style="margin-top:16px; font-size:20px; font-weight:600">${o.note}</div>
          </div>`)
        const $s = sel => s.querySelector(sel)
        const [a, b] = o.draw
        lift($s('#kick'), rise(t, -0.15, 0.5), 10)
        wipe($s('#grid'), rise(t, -0.3, 1, ease.out))
        lift($s('#counter'), rise(t, 0, 0.7), 20)

        const day = 365 * ease.inOut((t - a) / (b - a))
        const v = f(day)
        $s('#line').setAttribute('d', day > 0.5 ? c.path(f, day) : '')
        $s('#area').setAttribute('d', day > 0.5 ? c.area(f, day, 0) : '')
        $s('#exp').textContent = Math.round(day)
        $s('#value').textContent = fmt(v, o.digits)
        $s('#note').style.opacity = rise(t, b - 0.1, 0.5)

        // The moving tip: a dot, a halo and the day
        const X = c.sx(day), Y = c.sy(v)
        const tipOn = clamp((t - a) / 0.2)
        $s('#tip').innerHTML = `<circle cx="${X}" cy="${Y}" r="13" fill="var(--${o.color}-soft)" opacity="${tipOn}" />
          <circle cx="${X}" cy="${Y}" r="5.5" fill="var(--${o.color})" stroke="var(--paper)" stroke-width="2" opacity="${tipOn}" />
          <text x="${X - 18}" y="${Y - 18}" text-anchor="end" style="fill:var(--ink)" opacity="${tipOn}">Day ${Math.round(day)}</text>`

        // A landmark the curve passes (doubling, halving)
        const m = o.mark
        const mp = rise(t, a + (b - a) * 0.42, 0.6)
        const mx = c.sx(m.day), my = c.sy(f(m.day))
        $s('#mark').innerHTML = day < m.day ? '' : `<g opacity="${mp}">
          <line x1="${mx}" x2="${mx}" y1="${c.y + c.h}" y2="${my - 70}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 4" />
          <circle cx="${mx}" cy="${my}" r="4.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5" />
          <text x="${mx + 10}" y="${my - 60}" style="fill:var(--ink); font-size:13px">${m.label[0]}</text>
          <text x="${mx + 10}" y="${my - 42}">${m.label[1]}</text></g>`
        return s
      }

      window.kit = { $, clamp, lerp, ease, rise, lift, wipe, fmt, frame, scene, chart, curveShot }
      window.ready = document.fonts.ready
    </script>
  </body>
</html>
