<!doctype html>
<!--
  02 · Caption layer, composited over the Blender frames by
  engine/video/blender.mjs. Transparent background; render(t) shows the
  caption for t seconds. ?lang= picks the copy (English for now; other
  languages are a caption swap, no re-render).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=JetBrains+Mono:wght@500&display=block"
    />
    <style>
      :root {
        --accent: #ffb340;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 720px;
        height: 1280px;
        overflow: hidden;
        background: transparent;
        color: #fff;
        font-family: Archivo, system-ui, sans-serif;
      }
      #chrome {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        padding: 92px 100px 10px 44px;
        display: flex;
        justify-content: space-between;
        font: 500 18px 'JetBrains Mono', monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #d6dcea;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
      }
      #progress {
        position: absolute;
        left: 0;
        top: 0;
        height: 8px;
        background: var(--accent);
      }
      .cap {
        position: absolute;
        left: 44px;
        right: 100px;
        top: 150px;
        padding: 22px 24px 24px;
        background: rgba(11, 15, 25, 0.86);
        border-left: 6px solid var(--accent);
        font-size: 50px;
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1;
        opacity: 0;
      }
      .cap small {
        display: block;
        margin-top: 14px;
        font: 500 22px/1.45 'JetBrains Mono', monospace;
        letter-spacing: 0.02em;
        color: #b8c2d6;
      }
      .cap em {
        font-style: normal;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="progress"></div>
    <div id="chrome"><span id="kicker"></span><span>oliverz.dev</span></div>
    <div id="caps"></div>
    <script>
      const COPY = {
        en: {
          caps: [
            [0, 1, 'You press <em>Enter</em> in Claude Code.'],
            [1, 3, 'Your prompt and its context leave as one request.<small>the chat so far · instructions · tools · files it read · over HTTPS</small>'],
            [3, 5, 'Out through your internet provider…'],
            [5, 8, '…and across an ocean, in a cable on the seabed.<small>Almost all data between continents travels this way. (TeleGeography)</small>'],
            [8, 10, 'To a data center, possibly an ocean away.'],
            [10, 11, 'Chips like <em>GPUs</em> and <em>TPUs</em> run the model.'],
            [11, 13, 'Layer by layer, it works out the next token.<small>simplified: attention, then MLP, in every layer</small>'],
            [13, 14, 'Each token comes back the same way, <em>streamed</em>.'],
            [14, 16, 'Sometimes the reply is a request.<small>Read a file, run a command. You approve; it runs on your machine; the result goes back.</small>'],
            [16, 19, 'Again and again, until it\'s done.<br /><em>That loop is the agent.</em>'],
            [19, 20, 'oliverz<em>.</em>dev<small>Sources: Anthropic docs (code.claude.com, platform.claude.com), anthropic.com/news, TeleGeography. Route and screen are illustrative.</small>']
          ],
          kick: ['Enter', 'Home', 'Home', 'Provider', 'Provider', 'Ocean', 'Ocean', 'Ocean', 'Data center', 'Data center', 'Chips', 'Model', 'Model', 'The way back', 'The tool loop', 'The tool loop', 'The loop', 'The loop', 'The loop', 'Sources']
        }
      }
      const lang = COPY[new URLSearchParams(location.search).get('lang')] ? new URLSearchParams(location.search).get('lang') : 'en'
      const c = COPY[lang]
      const BAR = 2.4
      const DURATION = 20 * BAR
      const clamp = x => Math.min(1, Math.max(0, x))
      const rise = (t, a, d) => 1 - Math.pow(1 - clamp((t - a) / d), 3)
      const host = document.getElementById('caps')
      const els = c.caps.map(([a, b, html]) => {
        const el = document.createElement('div')
        el.className = 'cap'
        el.innerHTML = html
        host.appendChild(el)
        return [el, a, b]
      })
      function render(t) {
        for (const [el, a, b] of els) {
          const p = rise(t, a * BAR + 0.1, 0.3) * (b === 20 ? 1 : 1 - rise(t, b * BAR - 0.22, 0.2))
          el.style.opacity = p
          el.style.transform = `translateY(${(1 - p) * 24}px)`
        }
        document.getElementById('kicker').textContent = `02 — ${c.kick[Math.min(19, Math.floor(t / BAR))]}`
        document.getElementById('progress').style.width = `${(t / DURATION) * 100}%`
      }
      window.DURATION = DURATION
      window.render = render
      window.ready = document.fonts.ready
      render(Number(new URLSearchParams(location.search).get('t') ?? 0))
    </script>
  </body>
</html>
