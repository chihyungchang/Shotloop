      html, body { margin: 0; width: 1080px; height: 1920px; background: #101418; color: #f5f5f7;

      .k { position: absolute; left: 0; right: 0; top: 600px; text-align: center; font-size: 34px; letter-spacing: 0.2em; color: #ff9f5a; }
      h1 { position: absolute; left: 90px; right: 90px; top: 680px; margin: 0; text-align: center; font-size: 120px; font-weight: 600; line-height: 1.15; }

  </head>
