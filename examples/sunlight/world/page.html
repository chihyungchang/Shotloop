<!doctype html>
<!--
  World of "阳光到地球，要走多久？": deep space at 720×1280 CSS px
  (rendered at 1.5x). A canvas holds the sky (a seeded star field), the
  Sun, the planets and light; a DOM layer above it holds the type. Shots
  draw both from shots/*/shot.js through window.kit; nothing animates on
  its own, every frame is a pure function of shot time.

  Safe area: key text stays inside x 56–616 and y 120–1040 (the bottom
  ~18% and the right edge belong to the platform's UI).
-->
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --space: #03050c;
        --navy: #081026;
        --text: #f5f7fc;
        --muted: #9aa6c2;
        --dim: #5d6987;
        --gold: #ffc861;
        --gold-hot: #ffe3a3;
        --blue: #5fa8ff;
        --sans: 'PingFang SC', -apple-system, 'Helvetica Neue', sans-serif;
        --mono: 'SF Mono', ui-monospace, Menlo, monospace;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 720px; height: 1280px; overflow: hidden; background: var(--space); color: var(--text);
        font-family: var(--sans); -webkit-font-smoothing: antialiased; }
      canvas, #vignette, #ui { position: absolute; inset: 0; width: 720px; height: 1280px; }
      #vignette { background: radial-gradient(120% 80% at 50% 45%, transparent 55%, rgba(0, 0, 4, 0.7) 100%); pointer-events: none; }
      #ui > * { position: absolute; will-change: transform, opacity; }

      /* Type */
      .kicker { font: 600 22px/1 var(--sans); letter-spacing: 0.24em; color: var(--gold); display: flex; align-items: center; gap: 14px; }
      .kicker::before { content: ''; width: 36px; height: 2px; background: var(--gold); box-shadow: 0 0 10px rgba(255, 200, 97, 0.8); }
      .head { font: 800 64px/1.18 var(--sans); letter-spacing: 0.01em; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6); }
      .head.l { font-size: 76px; }
      .head.m { font-size: 52px; }
      .sub { font: 500 28px/1.5 var(--sans); color: var(--muted); letter-spacing: 0.02em; }
      .num { font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
      .unit { font: 700 40px/1 var(--sans); color: var(--text); }
      .gold { color: var(--gold); text-shadow: 0 0 24px rgba(255, 176, 60, 0.55); }
      .blue { color: #8cc4ff; }
      .muted { color: var(--muted); }
      .rule { height: 1px; background: linear-gradient(90deg, rgba(255, 200, 97, 0.7), rgba(255, 200, 97, 0)); }
      .chip { font: 600 22px/1 var(--sans); color: var(--muted); padding: 10px 16px; border: 1px solid rgba(154, 166, 194, 0.3);
        border-radius: 999px; background: rgba(8, 16, 38, 0.55); letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <canvas id="sky"></canvas>
    <div id="vignette"></div>
    <div id="ui"></div>
    <script>
      const W = 720
      const H = 1280
      const DPR = window.devicePixelRatio || 1
      const cv = document.getElementById('sky')
      cv.width = Math.round(W * DPR)
      cv.height = Math.round(H * DPR)
      const c = cv.getContext('2d')
      const ui = document.getElementById('ui')

      // ---- Time helpers ----
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
      const lerp = (a, b, p) => a + (b - a) * p
      const ease = {
        out: p => 1 - Math.pow(1 - clamp(p), 3),
        inOut: p => { p = clamp(p); return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 },
        expo: p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(p)))
      }
      // 0 → 1 over [a, a + d], eased out
      const rise = (t, a, d = 0.6) => ease.out((t - a) / d)
      // 1 → 0 over [a, a + d]
      const fall = (t, a, d = 0.4) => 1 - ease.inOut((t - a) / d)

      // Inline style for a block entering with progress p (fade, lift, unblur)
      const show = (p, dy = 26) =>
        `opacity:${p.toFixed(3)};transform:translateY(${((1 - p) * dy).toFixed(1)}px);filter:blur(${((1 - p) * 8).toFixed(1)}px)`
      // An absolutely placed block: { x, y, w, p, dy, cls, html, style }
      const block = ({ x = 56, y, w = 560, p = 1, dy, cls = '', html, style = '' }) =>
        `<div class="${cls}" style="left:${x}px;top:${y}px;width:${w}px;${show(p, dy)};${style}">${html}</div>`
      const setUI = html => { ui.innerHTML = html }

      // Grouped thousands, fixed decimals
      const fmt = (x, d = 0) => x.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d })

      // ---- Seeded randomness: the same stars on every frame ----
      function prng(seed) {
        return () => {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0
          let r = Math.imul(seed ^ (seed >>> 15), 1 | seed)
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296
        }
      }
      const rnd = prng(20120831)
      const STARS = Array.from({ length: 340 }, () => {
        const big = rnd() < 0.05
        return {
          x: rnd() * W, y: rnd() * H, depth: 0.3 + rnd() * 0.7,
          r: big ? 1.2 + rnd() * 0.9 : 0.35 + rnd() * 0.75,
          a: big ? 0.8 + rnd() * 0.2 : 0.2 + rnd() * 0.55,
          tw: 0.6 + rnd() * 1.6, ph: rnd() * 6.283, big,
          warm: rnd() < 0.25
        }
      })

      // ---- The sky: navy depth, two faint nebulae, stars with parallax ----
      // drift: px the far stars have moved (shots pass time-based drift)
      function space(t, { drift = 0, driftY = 0, glow = 1 } = {}) {
        c.setTransform(DPR, 0, 0, DPR, 0, 0)
        c.globalCompositeOperation = 'source-over'
        const g = c.createLinearGradient(0, 0, 0, H)
        g.addColorStop(0, '#040714')
        g.addColorStop(0.55, '#060b1d')
        g.addColorStop(1, '#03050c')
        c.fillStyle = g
        c.fillRect(0, 0, W, H)
        const neb = (x, y, r, col) => {
          const n = c.createRadialGradient(x, y, 0, x, y, r)
          n.addColorStop(0, col)
          n.addColorStop(1, 'rgba(0,0,0,0)')
          c.fillStyle = n
          c.fillRect(0, 0, W, H)
        }
        neb(600 - drift * 0.2, 260, 520, `rgba(40, 70, 160, ${0.16 * glow})`)
        neb(80 - drift * 0.2, 1080, 560, `rgba(90, 40, 120, ${0.1 * glow})`)
        for (const s of STARS) {
          const x = (((s.x - drift * s.depth) % W) + W) % W
          const y = (((s.y - driftY * s.depth) % H) + H) % H
          const a = s.a * (0.72 + 0.28 * Math.sin(t * s.tw + s.ph))
          c.fillStyle = s.warm ? `rgba(255, 226, 190, ${a})` : `rgba(220, 232, 255, ${a})`
          c.beginPath()
          c.arc(x, y, s.r, 0, 6.283)
          c.fill()
          if (s.big) {
            const h = c.createRadialGradient(x, y, 0, x, y, s.r * 6)
            h.addColorStop(0, `rgba(200, 220, 255, ${a * 0.35})`)
            h.addColorStop(1, 'rgba(200, 220, 255, 0)')
            c.fillStyle = h
            c.fillRect(x - s.r * 6, y - s.r * 6, s.r * 12, s.r * 12)
          }
        }
      }

      const radial = (x, y, r0, r1, stops) => {
        const g = c.createRadialGradient(x, y, r0, x, y, r1)
        for (const [o, col] of stops) g.addColorStop(o, col)
        return g
      }
      const disc = (x, y, r, fill) => {
        c.fillStyle = fill
        c.beginPath()
        c.arc(x, y, r, 0, 6.283)
        c.fill()
      }

      // ---- The Sun: bloom, corona, anamorphic streak, limb-darkened disc ----
      const SPOTS = (() => {
        const q = prng(7)
        return Array.from({ length: 90 }, () => ({ a: q() * 6.283, d: Math.sqrt(q()) * 0.95, s: 0.1 + q() * 0.16, k: q() }))
      })()
      function sun(t, x, y, r, { glow: gl = 1, streak = 1 } = {}) {
        c.globalCompositeOperation = 'lighter'
        const pulse = 1 + 0.03 * Math.sin(t * 1.7)
        c.fillStyle = radial(x, y, 0, r * 7 * pulse, [
          [0, `rgba(255, 150, 50, ${0.32 * gl})`], [0.25, `rgba(255, 110, 30, ${0.12 * gl})`], [1, 'rgba(255, 90, 20, 0)']])
        c.fillRect(x - r * 8, y - r * 8, r * 16, r * 16)
        c.fillStyle = radial(x, y, r * 0.8, r * 2.2, [
          [0, `rgba(255, 220, 140, ${0.7 * gl})`], [0.35, `rgba(255, 170, 70, ${0.25 * gl})`], [1, 'rgba(255, 140, 40, 0)']])
        c.fillRect(x - r * 3, y - r * 3, r * 6, r * 6)
        // Slowly turning corona rays
        c.save()
        c.translate(x, y)
        for (let i = 0; i < 14; i++) {
          const a = (i / 14) * 6.283 + t * 0.06 + (i % 2) * 0.13
          const len = r * (1.9 + 0.6 * Math.sin(i * 2.3 + t * 0.8))
          c.rotate(a)
          const g = c.createLinearGradient(0, 0, len, 0)
          g.addColorStop(0, `rgba(255, 210, 130, ${0.16 * gl})`)
          g.addColorStop(1, 'rgba(255, 180, 90, 0)')
          c.fillStyle = g
          c.beginPath()
          c.moveTo(r * 0.6, -r * 0.09)
          c.lineTo(len, 0)
          c.lineTo(r * 0.6, r * 0.09)
          c.fill()
          c.rotate(-a)
        }
        c.restore()
        // Anamorphic streak
        if (streak > 0) {
          c.save()
          c.translate(x, y)
          c.scale(1, 0.018)
          c.fillStyle = radial(0, 0, 0, r * 7, [[0, `rgba(255, 220, 160, ${0.55 * streak * gl})`], [1, 'rgba(255, 200, 120, 0)']])
          c.fillRect(-r * 7, -r * 7, r * 14, r * 14)
          c.restore()
        }
        c.globalCompositeOperation = 'source-over'
        // Disc with limb darkening
        disc(x, y, r, radial(x - r * 0.12, y - r * 0.12, 0, r * 1.05, [
          [0, '#fffef8'], [0.5, '#fff3cc'], [0.78, '#ffd37c'], [0.93, '#ffa53c'], [1, '#f27c24']]))
        // Granulation: soft drifting cells, clipped to the disc
        c.save()
        c.beginPath()
        c.arc(x, y, r, 0, 6.283)
        c.clip()
        for (const s of SPOTS) {
          const a = s.a + t * 0.05
          const px = x + Math.cos(a) * s.d * r
          const py = y + Math.sin(a) * s.d * r
          const sr = s.s * r
          c.fillStyle = radial(px, py, 0, sr, [[0, s.k < 0.5 ? 'rgba(255,255,240,0.07)' : 'rgba(240,140,40,0.05)'], [1, 'rgba(0,0,0,0)']])
          c.fillRect(px - sr, py - sr, sr * 2, sr * 2)
        }
        c.restore()
        // Bloom over the disc: the edge melts into its own light
        halo(x, y, r * 1.35, '255, 236, 190', 0.28 * gl)
      }

      // ---- A planet lit from direction `light` (radians, toward the Sun) ----
      const LAND = (() => {
        const q = prng(42)
        return Array.from({ length: 9 }, () => ({ a: q() * 6.283, d: q() * 0.75, w: 0.18 + q() * 0.3, h: 0.1 + q() * 0.18, rot: q() * 3 }))
      })()
      function planet(t, x, y, r, { light = Math.PI, kind = 'earth', spin = 0 } = {}) {
        const pal = {
          earth: { atm: '90, 160, 255', stops: [[0, '#bfe4ff'], [0.35, '#4a9bf0'], [0.75, '#1f5fc4'], [1, '#0b2a66']] },
          moon: { atm: '200, 205, 220', stops: [[0, '#f1f1f4'], [0.5, '#b9bcc6'], [1, '#6c7080']] },
          neptune: { atm: '90, 130, 255', stops: [[0, '#b8ceff'], [0.45, '#4e74e6'], [1, '#1d2f8c']] }
        }[kind]
        const lx = Math.cos(light)
        const ly = Math.sin(light)
        c.globalCompositeOperation = 'lighter'
        c.fillStyle = radial(x, y, r * 0.9, r * 1.7, [[0, `rgba(${pal.atm}, ${kind === 'moon' ? 0.12 : 0.35})`], [1, `rgba(${pal.atm}, 0)`]])
        c.fillRect(x - r * 2, y - r * 2, r * 4, r * 4)
        c.globalCompositeOperation = 'source-over'
        disc(x, y, r, radial(x + lx * r * 0.4, y + ly * r * 0.4, 0, r * 1.25, pal.stops))
        c.save()
        c.beginPath()
        c.arc(x, y, r, 0, 6.283)
        c.clip()
        if (kind === 'earth' && r > 30) {
          // Land and cloud bands, soft-edged, drifting with spin
          c.filter = `blur(${(r * 0.05).toFixed(1)}px)`
          for (const l of LAND) {
            const a = l.a + spin
            const px = x + Math.cos(a) * l.d * r
            const py = y + Math.sin(l.a * 1.7) * l.d * r * 0.8
            c.save()
            c.translate(px, py)
            c.rotate(l.rot)
            c.scale(l.w * r, l.h * r)
            disc(0, 0, 1, 'rgba(86, 128, 80, 0.5)')
            c.restore()
          }
          c.strokeStyle = 'rgba(255, 255, 255, 0.22)'
          c.lineCap = 'round'
          for (let i = 0; i < 5; i++) {
            const yy = y - r * 0.7 + i * r * 0.36
            c.lineWidth = r * (0.05 + (i % 2) * 0.03)
            c.beginPath()
            c.moveTo(x - r + ((spin * 40 + i * 37) % (r * 0.6)), yy)
            c.bezierCurveTo(x - r * 0.3, yy - r * 0.12, x + r * 0.2, yy + r * 0.12, x + r * 0.7, yy - r * 0.05)
            c.stroke()
          }
          c.filter = 'none'
        }
        if (kind === 'moon') {
          const q = prng(3)
          for (let i = 0; i < 7; i++) disc(x + (q() - 0.5) * r * 1.3, y + (q() - 0.5) * r * 1.3, r * (0.08 + q() * 0.14), 'rgba(90, 94, 110, 0.35)')
        }
        if (kind === 'neptune') {
          for (let i = 0; i < 4; i++) {
            c.fillStyle = `rgba(150, 180, 255, ${0.12 + 0.05 * i})`
            c.fillRect(x - r, y - r * 0.6 + i * r * 0.38, r * 2, r * 0.1)
          }
        }
        // Night side: darkness grows away from the sunlit point
        c.fillStyle = radial(x + lx * r * 0.6, y + ly * r * 0.6, r * 0.2, r * 2, [
          [0, 'rgba(2, 5, 16, 0)'], [0.4, 'rgba(2, 5, 16, 0.5)'], [0.62, 'rgba(2, 5, 16, 0.9)'], [1, 'rgba(2, 5, 16, 0.97)']])
        c.fillRect(x - r, y - r, r * 2, r * 2)
        c.restore()
        // Thin sunlit rim
        c.strokeStyle = `rgba(${kind === 'moon' ? '255, 250, 235' : '170, 215, 255'}, 0.6)`
        c.lineWidth = Math.min(3, Math.max(1, r * 0.035))
        c.beginPath()
        c.arc(x, y, r - c.lineWidth / 2, light - 1.2, light + 1.2)
        c.stroke()
      }

      // ---- Light: a golden pulse at progress p along (x0,y0)→(x1,y1) ----
      function beam(x0, y0, x1, y1, p, { tail = 0.35, width = 3, guide = 0.16, head = 1 } = {}) {
        const pt = q => [lerp(x0, x1, q), lerp(y0, y1, q)]
        c.strokeStyle = `rgba(255, 200, 97, ${guide})`
        c.lineWidth = 1
        c.setLineDash([2, 8])
        c.beginPath()
        c.moveTo(x0, y0)
        c.lineTo(x1, y1)
        c.stroke()
        c.setLineDash([])
        if (p <= 0) return
        const q0 = Math.max(0, p - tail)
        const [ax, ay] = pt(q0)
        const [bx, by] = pt(Math.min(1, p))
        c.globalCompositeOperation = 'lighter'
        for (const [w, a] of [[width * 6, 0.12], [width * 2.5, 0.35], [width, 1]]) {
          const g = c.createLinearGradient(ax, ay, bx, by)
          g.addColorStop(0, 'rgba(255, 190, 80, 0)')
          g.addColorStop(1, `rgba(255, 225, 150, ${a})`)
          c.strokeStyle = g
          c.lineWidth = w
          c.lineCap = 'round'
          c.beginPath()
          c.moveTo(ax, ay)
          c.lineTo(bx, by)
          c.stroke()
        }
        if (head > 0 && p < 1) {
          c.fillStyle = radial(bx, by, 0, 34, [[0, `rgba(255, 250, 225, ${head})`], [0.2, `rgba(255, 215, 130, ${0.6 * head})`], [1, 'rgba(255, 170, 60, 0)']])
          c.fillRect(bx - 34, by - 34, 68, 68)
        }
        c.globalCompositeOperation = 'source-over'
      }

      // A soft glow anywhere (flashes, arrivals)
      function halo(x, y, r, rgb, a) {
        if (a <= 0) return
        c.globalCompositeOperation = 'lighter'
        c.fillStyle = radial(x, y, 0, r, [[0, `rgba(${rgb}, ${a})`], [1, `rgba(${rgb}, 0)`]])
        c.fillRect(x - r, y - r, r * 2, r * 2)
        c.globalCompositeOperation = 'source-over'
      }

      window.kit = { W, H, c, clamp, lerp, ease, rise, fall, show, block, setUI, fmt, prng, space, sun, planet, beam, glow: halo, halo, radial, disc }
      window.ready = document.fonts.ready
    </script>
  </body>
</html>
