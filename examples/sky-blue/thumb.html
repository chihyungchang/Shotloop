<!doctype html>
<!-- Cover, 1080×1920; the text stays inside the centred 3:4 crop (y 240–1680). -->
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1080px; height: 1920px; color: #0c2340;
        background: linear-gradient(180deg, #e3effc 0%, #f4f8fe 55%, #fbfdff 100%);
        font-family: 'PingFang SC', -apple-system, sans-serif; }
      .kicker { position: absolute; left: 96px; top: 420px; font: 600 26px 'SF Mono', ui-monospace, Menlo, monospace;
        letter-spacing: 0.16em; color: #2a74e8; }
      h1 { position: absolute; left: 96px; right: 96px; top: 470px; margin: 0; font-weight: 800; font-size: 150px; line-height: 1.15; }
      h1 b { color: #2a74e8; }
      .win { position: absolute; left: 290px; top: 960px; width: 500px; height: 500px; border-radius: 50%;
        background: linear-gradient(180deg, #1f6fdc 0%, #5aa6f2 60%, #cfe6ff 100%);
        box-shadow: 0 24px 60px rgba(12, 35, 64, 0.16), 0 0 0 18px #fff; overflow: hidden; }
      .sun { position: absolute; left: 290px; top: 120px; width: 90px; height: 90px; border-radius: 50%; background: #ffd36b;
        box-shadow: 0 0 80px 40px rgba(255, 211, 107, 0.45); }
      .hill { position: absolute; left: -40px; right: -40px; top: 360px; height: 200px; border-radius: 50% 50% 0 0; background: #1d4f91; }
    </style>
  </head>
  <body>
    <div class="kicker">RAYLEIGH · 一个日常问题</div>
    <h1>为什么天空<br />是<b>蓝色</b>的？</h1>
    <div class="win"><div class="sun"></div><div class="hill"></div></div>
    <script>window.ready = document.fonts.ready</script>
  </body>
</html>
