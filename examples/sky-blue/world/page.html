<!doctype html>
<!--
  World of "为什么天空是蓝色的？": the stage every shot draws on, at
  720×1280 CSS px (rendered at 1.5x). Three layers: the sky (a gradient
  on <body>), the art (one full-stage SVG a shot fills each frame) and
  the head (kicker, headline, subline, chapter bar). Shots draw through
  window.kit; nothing animates on its own, every frame is a pure
  function of shot time. Safe area: x 40–620, y 110–1030.
-->
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --ink: #0c2340;
        --muted: #4f6582;
        --faint: #8ea3bd;
        --accent: #2a74e8;
        --sans: 'PingFang SC', -apple-system, 'Helvetica Neue', sans-serif;
        --mono: 'SF Mono', ui-monospace, Menlo, monospace;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 720px; height: 1280px; overflow: hidden; }
      body { background: #eef5fd; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
      #art { position: absolute; inset: 0; width: 720px; height: 1280px; }
      #head { position: absolute; left: 56px; right: 100px; top: 150px; }
      #kicker { font: 600 15px var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent);
        display: flex; align-items: center; gap: 12px; }
      #kicker i { display: block; width: 28px; height: 2px; background: currentColor; }
      #title { margin-top: 22px; font-weight: 800; font-size: 60px; line-height: 1.16; letter-spacing: -0.01em; }
      #title .line { display: block; overflow: hidden; padding-bottom: 0.06em; }
      #title .line > span { display: inline-block; will-change: transform; }
      #title b { color: var(--accent); font-weight: 800; }
      #sub { margin-top: 18px; font-weight: 500; font-size: 26px; line-height: 1.45; color: var(--muted); }
      #chapters { position: absolute; left: 56px; right: 100px; top: 110px; display: flex; gap: 8px; }
      #chapters span { flex: 1; height: 4px; border-radius: 2px; background: rgba(12, 35, 64, 0.12); overflow: hidden; }
      #chapters span i { display: block; height: 100%; background: var(--ink); border-radius: 2px; }
      .mono { font-family: var(--mono); }
    </style>
  </head>
  <body>
    <svg id="art" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="chapters"></div>
    <div id="head">
      <div id="kicker"><i></i><span></span></div>
      <h1 id="title"></h1>
      <p id="sub"></p>
    </div>
    <script>
      const $ = id => document.getElementById(id)
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
      const lerp = (a, b, p) => a + (b - a) * p
      // 0 → 1 over [a, a + d]
      const prog = (t, a, d) => clamp((t - a) / d)
      const ease = {
        out: p => 1 - Math.pow(1 - p, 3),
        inOut: p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
        back: p => 1 + 2.2 * Math.pow(p - 1, 3) + 1.2 * Math.pow(p - 1, 2)
      }
      const rise = (t, a, d = 0.6) => ease.out(prog(t, a, d))
      const glide = (t, a, d = 0.8) => ease.inOut(prog(t, a, d))
      const pop = (t, a, d = 0.6) => ease.back(prog(t, a, d))

      // Colours: one sky family that warms into sunset
      const C = {
        ink: '#0c2340', muted: '#4f6582', faint: '#8ea3bd', line: 'rgba(12,35,64,0.14)',
        blue: '#2a74e8', sky: '#5aa6f2', pale: '#dcecfc', violet: '#6c5ce7',
        red: '#ef4a3c', orange: '#ff8a3d', amber: '#ffb547', sun: '#ffd36b'
      }
      // The visible spectrum as seven bands, red (700 nm) → violet (400 nm)
      const SPECTRUM = [
        ['#ef4a3c', 700], ['#ff8a3d', 620], ['#ffc93f', 580], ['#3fc77a', 530],
        ['#2bbfd6', 490], ['#2a74e8', 450], ['#6c5ce7', 400]
      ]
      const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16))
      const mix = (a, b, p) => {
        const [x, y] = [hex(a), hex(b)]
        return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], clamp(p)))).join(',')})`
      }

      // The sky behind everything: a vertical gradient through stops
      function sky(...stops) {
        const n = stops.length - 1
        document.body.style.background = `linear-gradient(180deg, ${stops.map((c, i) => `${c} ${Math.round((i / n) * 100)}%`).join(', ')})`
      }

      // A sine wave along a straight line from (x0, y0) to (x1, y1)
      function wave(x0, y0, x1, y1, { len = 40, amp = 12, phase = 0, step = 3 } = {}) {
        const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy)
        if (L < 1) return ''
        const [ux, uy, nx, ny] = [dx / L, dy / L, -dy / L, dx / L]
        let d = ''
        for (let s = 0; s <= L; s += step) {
          const o = amp * Math.sin(((s - phase) / len) * Math.PI * 2)
          d += `${s ? 'L' : 'M'}${(x0 + ux * s + nx * o).toFixed(1)},${(y0 + uy * s + ny * o).toFixed(1)}`
        }
        return d
      }

      // Soft glow filter and gradients the shots share; prepended to every frame
      const DEFS = `<defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18" /></filter>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" /></filter>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0c2340" flood-opacity="0.14" /></filter>
        <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff4c8" /><stop offset="0.45" stop-color="#ffd36b" stop-opacity="0.55" />
          <stop offset="1" stop-color="#ffd36b" stop-opacity="0" /></radialGradient>
      </defs>`
      const art = svg => ($('art').innerHTML = DEFS + svg)

      // A sun: core disc, rim and bloom
      const sun = (x, y, r, a = 1, core = '#ffd36b') => `<g opacity="${a}">
        <circle cx="${x}" cy="${y}" r="${r * 3.2}" fill="url(#sunGlow)" />
        <circle cx="${x}" cy="${y}" r="${r}" fill="${core}" /><circle cx="${x - r * 0.18}" cy="${y - r * 0.18}" r="${r * 0.5}" fill="#fff6d6" opacity="0.45" /></g>`

      // A small mono label, optionally on a white chip
      const label = (x, y, text, { color = C.ink, size = 15, anchor = 'start', a = 1, chip = false, weight = 600 } = {}) => {
        // CJK glyphs are a full em wide, the mono ones about 0.62 em
        const w = [...text].reduce((n, c) => n + (c.charCodeAt(0) > 0x2e80 ? 1 : 0.62), 0) * size + 22
        const bx = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w + 10 : x - 10
        return `<g opacity="${a}">${chip ? `<rect x="${bx}" y="${y - size - 7}" width="${w}" height="${size + 16}" rx="${(size + 16) / 2}" fill="#fff" opacity="0.92" />` : ''}
          <text x="${x}" y="${y}" text-anchor="${anchor}" font-family="SF Mono, ui-monospace, Menlo, monospace" font-size="${size}" font-weight="${weight}"
            letter-spacing="0.04em" fill="${color}">${text}</text></g>`
      }

      // The head: kicker, headline lines that slide up out of a mask, subline.
      // The DOM is rebuilt only when the text changes.
      let key = ''
      function head(t, { kicker, lines, sub = '', at = 0, accent = C.blue, ink = C.ink, size = 60 }) {
        const k = JSON.stringify([kicker, lines, sub])
        if (k !== key) {
          key = k
          $('kicker').querySelector('span').textContent = kicker
          $('title').innerHTML = lines.map(l => `<span class="line"><span>${l}</span></span>`).join('')
          $('sub').innerHTML = sub
        }
        document.documentElement.style.setProperty('--accent', accent)
        $('title').style.color = ink
        $('title').style.fontSize = `${size}px`
        const k0 = rise(t, at, 0.5)
        $('kicker').style.opacity = k0
        $('kicker').style.transform = `translateX(${(1 - k0) * -16}px)`
        $('title').querySelectorAll('.line > span').forEach((el, i) => {
          const p = rise(t, at + 0.12 + i * 0.12, 0.7)
          el.style.transform = `translateY(${(1 - p) * 110}%)`
        })
        const s = rise(t, at + 0.35 + lines.length * 0.12, 0.6)
        $('sub').style.opacity = s
        $('sub').style.transform = `translateY(${(1 - s) * 14}px)`
      }

      // Chapter bar: n chapters, this is chapter i (0-based), p of it played
      function chapters(i, n, p) {
        const el = $('chapters')
        if (el.children.length !== n) el.innerHTML = '<span><i></i></span>'.repeat(n)
        ;[...el.children].forEach((s, j) => (s.firstChild.style.width = `${(j < i ? 1 : j > i ? 0 : clamp(p)) * 100}%`))
      }

      window.kit = { $, clamp, lerp, prog, ease, rise, glide, pop, C, SPECTRUM, mix, sky, wave, art, sun, label, head, chapters }
      window.ready = document.fonts.ready
    </script>
  </body>
</html>
