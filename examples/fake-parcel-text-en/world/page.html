<!doctype html>
<!--
  shotloop-look: graphite
  shotloop-style: ui
  World of a 2D Shotloop project in the "Graphite" look: neutral graphite with electric blue; tech, products, engineering.
  720×1280 CSS px, rendered at 1.5x. Every shot draws through window.kit;
  nothing animates on its own, every frame is a pure function of time.

  Layout: kicker and headline at the top (y 154…), the stage (an SVG
  covering the frame, viewBox 0 0 720 1280) for diagrams, numbers and icons.
  Keep text and the subject inside x 40…620, y 110…1024 (the
  platforms' buttons cover the rest); backgrounds may fill the whole frame.

  kit:
    W, H                            frame size
    PAD, SAFE_TOP, SAFE_RIGHT, SAFE_BOTTOM   the safe area (x PAD…SAFE_RIGHT)
    C                               the look (the ground and the type only): text,
                                    muted, accent (the highlighted word), accent2,
                                    accent3, line, panel
    C.hue                           content colors, the same in every look: red,
                                    orange, yellow, green, teal, blue, violet, pink,
                                    gray. Pictures and data take the colors their
                                    subject needs (the sky blue, the sun yellow, a
                                    loss red, growth green), not the look's accents
    C.series                        default chart colors, from C.hue
    FONT, HEAD_FONT                 font stacks (normal widths; never squeeze text)
    clamp, lerp, ease(p), rise(t, a, d = 0.4), pop(t, a, d = 0.5)
                                    timing: rise is 0→1 over [a, a+d] eased out,
                                    pop overshoots a little (for things that land)
    frame({ kicker, head, typed = 1, sub, subIn = 1, progress, align, top })
                                    sets the top texts; head is a string or lines,
                                    *word* is highlighted in the accent; typed
                                    0→1 types it in; progress 0→1 fills the bar
    stage(svgMarkup) → q            replaces the stage's content, returns
                                    q(selector) for its elements
    set(el, { attr: value, style: { … } })
    drawOn(el, p)                   draws a stroked path/line/circle on, p 0→1
    count(p, from, to, digits = 0)  a number for counters
    stagger(t, i, a, step = 0.12, d = 0.4)   item i of a group revealed in turn
    hold(t, a, b, d = 0.3)          0→1→0: on screen from a to b, fading d
    float(t, amp = 4, period = 3, phase = 0)  gentle idle motion (px) for things at rest
    view({ x, y, s })               the stage's camera: zoom s around (x, y),
                                    after stage(); s = 1 is the whole frame
    readTime(text)                  seconds a caption must stay fully on screen
    hash(a, b = 0)                  seeded random 0…1, the same every frame
                                    (never Math.random)
    waffle({ x, y, w, n, cols, lit, color, p, litP })  SVG markup: n squares,
                                    revealed with p, the first lit lighting with litP
    arrow(x1, y1, x2, y2, { color, width })      SVG markup
    bars({ x, y, w, h, values, labels, colors, p }) SVG markup, bars grow with p
    card(t, { kicker, title, body, progress })  the starter title card

  Interface demo (this style): a phone or a browser on the stage, its
  screen showing what happens (messages arrive, a link is tapped, a field
  fills in). Screens use a neutral light or dark system UI, not the look;
  the look frames them. Keep one device per shot, large, inside the safe
  area; point at what matters with tap().
    phone({ x, y, w = 300, screen, dark = false, p = 1, tilt = 0 })   the device on the #ui
                                    layer; screen is HTML from the parts below
    browser({ x, y, w = 600, h = 400, url, screen, dark = false, p = 1 })
    appBar(title, { back = false })     msg({ text, me = false, p = 1, time })
    notif({ app, title, body, p = 1 })  button(label, { primary = true, pressed = 0 })
    field(label, value, { typed = 1 })  row({ title, sub, icon })   toast(text, p)
                                    screen parts, HTML strings to join
    tap(x, y, p, { color })         a finger tap with a ripple at (x, y) on the frame
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --text: #f5f7fa; --muted: #a3aab5; --accent: #4c9dff; --accent2: #f5f7fa; --accent3: #ffb547;
        --line: rgba(255, 255, 255, 0.14); --panel: rgba(255, 255, 255, 0.06);
        --font: 'PingFang SC', -apple-system, sans-serif; --head: 'PingFang SC', -apple-system, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 720px; height: 1280px; overflow: hidden; color: var(--text); font-family: var(--font); }
      body { background: radial-gradient(120% 80% at 50% 0%, #2b2f36 0%, #1a1d22 55%, #101215 100%); }
      #stage { position: absolute; inset: 0; width: 720px; height: 1280px; overflow: visible; }
      #progress { position: absolute; left: 0; top: 0; height: 6px; width: 0; background: var(--accent); }
      #kicker { position: absolute; left: 40px; top: 110px; width: 580px; font: 600 20px var(--font);
        letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
      #head { position: absolute; left: 40px; top: 154px; width: 580px; font: 800 61px/1.12 var(--head);
        letter-spacing: -0.01em; text-shadow: none; }
      #head b { color: var(--accent); font-weight: inherit; }
      #head .ghost { opacity: 0; }
      #sub { position: absolute; left: 40px; width: 580px; font: 500 26px/1.4 var(--font); color: var(--muted); }

      #ui { position: absolute; inset: 0; pointer-events: none; }
      .dev { position: absolute; border-radius: 42px; padding: 12px; background: #0b0d12; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), 0 0 0 2px rgba(255, 255, 255, 0.08); }
      .dev .scr { position: relative; border-radius: 32px; overflow: hidden; height: 100%; font: 500 15px/1.35 -apple-system, 'PingFang SC', sans-serif; }
      .dev .scr.l { background: #f2f3f7; color: #111; } .dev .scr.d { background: #101114; color: #f2f2f5; }
      .dev .notch { position: absolute; top: 20px; left: 50%; width: 92px; height: 26px; margin-left: -46px; border-radius: 14px; background: #000; z-index: 2; }
      .dev .sb { height: 46px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 26px 6px; font-size: 13px; font-weight: 700; }
      .win { position: absolute; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1); }
      .win .bar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #e6e7eb; color: #555; font: 500 13px -apple-system, sans-serif; }
      .win .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; } .win .bar i + i { background: #febc2e; } .win .bar i + i + i { background: #28c840; }
      .win .bar span { flex: 1; margin-left: 10px; padding: 5px 10px; border-radius: 6px; background: #fff; }
      .win .scr { height: calc(100% - 38px); }
      .ab { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-weight: 700; font-size: 17px; border-bottom: 1px solid rgba(128, 128, 128, 0.2); }
      .bub { max-width: 76%; margin: 6px 12px; padding: 9px 13px; border-radius: 18px; background: #e5e5ea; color: #111; }
      .bub.me { margin-left: auto; background: #0a84ff; color: #fff; }
      .scr.d .bub { background: #2c2c2e; color: #f2f2f5; } .scr.d .bub.me { background: #0a84ff; }
      .ntf { margin: 8px 10px; padding: 11px 13px; border-radius: 18px; background: rgba(250, 250, 252, 0.92); color: #111; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); }
      .ntf b { display: block; font-size: 13px; } .ntf small { color: #666; font-size: 12px; }
      .btn { margin: 10px 16px; padding: 13px; border-radius: 14px; text-align: center; font-weight: 700; background: #e5e5ea; color: #111; }
      .btn.pri { background: #0a84ff; color: #fff; }
      .fld { margin: 8px 16px; padding: 10px 12px; border-radius: 12px; background: rgba(128, 128, 128, 0.14); }
      .fld small { display: block; opacity: 0.6; font-size: 12px; }
      .row { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid rgba(128, 128, 128, 0.15); }
      .row .ic { width: 36px; height: 36px; border-radius: 10px; background: rgba(128, 128, 128, 0.2); display: grid; place-items: center; }
      .row small { display: block; opacity: 0.6; }
      .tst { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 10px 16px; border-radius: 12px; background: rgba(20, 20, 24, 0.9); color: #fff; white-space: nowrap; }
      .tap { position: absolute; border-radius: 50%; pointer-events: none; }
    </style>
  </head>
  <body>
    <svg id="stage" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="progress"></div>
    <div id="kicker"></div>
    <div id="head"></div>
    <div id="sub"></div>
    <script>
      const $ = id => document.getElementById(id)
      const W = 720, H = 1280, PAD = 40, SAFE_TOP = 110, SAFE_RIGHT = 620, SAFE_BOTTOM = 1024
      const C = {
        text: '#f5f7fa', muted: '#a3aab5', accent: '#4c9dff', accent2: '#f5f7fa', accent3: '#ffb547',
        line: 'rgba(255, 255, 255, 0.14)', panel: 'rgba(255, 255, 255, 0.06)', hue: {"red":"#ff5a5f","orange":"#ff9f40","yellow":"#ffd23f","green":"#4ade80","teal":"#2dd4bf","blue":"#4da3ff","violet":"#a78bfa","pink":"#f472b6","gray":"#9aa4b2"}
      }
      C.series = [C.hue.blue, C.hue.orange, C.hue.green, C.hue.violet, C.hue.gray]
      const FONT = "'PingFang SC', -apple-system, sans-serif", HEAD_FONT = "'PingFang SC', -apple-system, sans-serif"
      const clamp = x => Math.min(1, Math.max(0, x))
      const lerp = (a, b, p) => a + (b - a) * p
      const ease = p => { p = clamp(p); return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 }
      // 0 → 1 over [a, a + d], eased out
      const rise = (t, a, d = 0.4) => 1 - Math.pow(1 - clamp((t - a) / d), 3)
      // Eased out with a small overshoot, for things that land
      const pop = (t, a, d = 0.5) => {
        const p = clamp((t - a) / d), c = 1.7
        return p <= 0 ? 0 : 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2)
      }
      // Item i of a group, revealed step seconds after the one before
      const stagger = (t, i, a, step = 0.12, d = 0.4) => rise(t, a + i * step, d)
      // 0 → 1 → 0: on screen from a to b, fading in and out over d
      const hold = (t, a, b, d = 0.3) => Math.min(rise(t, a, d), 1 - rise(t, b - d, d))
      // Gentle idle motion (px) for things at rest
      const float = (t, amp = 4, period = 3, phase = 0) => amp * Math.sin((t / period + phase) * Math.PI * 2)
      // Seconds a caption must stay fully on screen: 1 s, plus 0.3 s per
      // word, 0.15 s per Chinese character (agent/src/principles.ts)
      function readTime(text) {
        const cjk = /[\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Hangul}]/gu
        const chars = (String(text).match(cjk) || []).length
        const words = String(text).replace(cjk, ' ').split(/\s+/).filter(w => /[\p{L}\p{N}]/u.test(w)).length
        return chars + words ? 1 + 0.3 * words + 0.15 * chars : 0
      }
      // A seeded random number in [0, 1): the same for the same a and b
      function hash(a, b = 0) {
        let h = Math.imul(Math.round(a * 1000) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(Math.round(b * 1000), 0xc2b2ae35)
        h ^= h >>> 13
        h = Math.imul(h, 0x27d4eb2f)
        h ^= h >>> 16
        return (h >>> 0) / 4294967296
      }
      const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')

      // Headline lines typed in by character; untyped text keeps its place
      function typeLines(lines, typed) {
        const fmt = s => esc(s).replace(/\*(.+?)\*/g, '<b>$1</b>')
        const plain = lines.map(l => l.replace(/\*/g, ''))
        const total = plain.reduce((n, l) => n + l.length, 0)
        let left = Math.round(clamp(typed) * total)
        return lines.map((line, i) => {
          const n = Math.min(left, plain[i].length)
          left -= n
          if (n >= plain[i].length) return '<div>' + fmt(line) + '</div>'
          return '<div>' + esc(plain[i].slice(0, n)) + '<span class="ghost">' + (esc(plain[i].slice(n)) || '&nbsp;') + '</span></div>'
        }).join('')
      }

      // The top texts for one frame
      function frame({ kicker = '', head = '', typed = 1, sub = '', subIn = 1, progress = 0, align = 'left', top = 154 } = {}) {
        $('progress').style.width = clamp(progress) * 100 + '%'
        $('kicker').textContent = kicker
        const el = $('head')
        el.style.top = top + 'px'
        el.style.textAlign = align
        el.innerHTML = typeLines(Array.isArray(head) ? head : head ? [head] : [], typed)
        const s = $('sub')
        s.textContent = sub
        s.style.textAlign = align
        s.style.top = top + el.offsetHeight + 18 + 'px'
        s.style.opacity = clamp(subIn)
        s.style.transform = 'translateY(' + (1 - clamp(subIn)) * 16 + 'px)'
        $('kicker').style.textAlign = align
        return el
      }

      // The stage's content for this frame; q finds its elements
      function stage(markup) {
        const svg = $('stage')
        svg.innerHTML = markup
        // Every frame starts from the whole frame; view() moves in
        svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H)
        return sel => svg.querySelector(sel)
      }
      function set(el, props) {
        if (!el) return el
        for (const [k, v] of Object.entries(props)) {
          if (k === 'style') Object.assign(el.style, v)
          else if (k === 'text') el.textContent = v
          else el.setAttribute(k, v)
        }
        return el
      }
      // Stroke draw-on, p 0 → 1
      function drawOn(el, p) {
        if (!el) return el
        const len = el.getTotalLength ? el.getTotalLength() : 1000
        el.style.strokeDasharray = len
        el.style.strokeDashoffset = len * (1 - clamp(p))
        return el
      }
      const count = (p, from, to, digits = 0) => lerp(from, to, clamp(p)).toFixed(digits)
      // The stage's camera: zoom s around (x, y)
      function view({ x = W / 2, y = H / 2, s = 1 } = {}) {
        const vw = W / s, vh = H / s
        $('stage').setAttribute('viewBox', (x - vw / 2) + ' ' + (y - vh / 2) + ' ' + vw + ' ' + vh)
      }

      function arrow(x1, y1, x2, y2, { color = C.accent, width = 5 } = {}) {
        const a = Math.atan2(y2 - y1, x2 - x1), hl = width * 3.2
        const p = (r, s) => (x2 + Math.cos(a + r) * s).toFixed(1) + ',' + (y2 + Math.sin(a + r) * s).toFixed(1)
        return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + (x2 - Math.cos(a) * hl * 0.6) + '" y2="' + (y2 - Math.sin(a) * hl * 0.6) +
          '" stroke="' + color + '" stroke-width="' + width + '" stroke-linecap="round"/>' +
          '<polygon points="' + x2 + ',' + y2 + ' ' + p(Math.PI - 0.45, hl) + ' ' + p(Math.PI + 0.45, hl) + '" fill="' + color + '"/>'
      }

      // A bar chart that grows with p (each bar a little after the last)
      function bars({ x = PAD, y = H * 0.72, w = SAFE_RIGHT - PAD, h = H * 0.3, values = [], labels = [], colors = C.series, p = 1 } = {}) {
        const max = Math.max(...values, 1), n = values.length, gap = w * 0.06, bw = (w - gap * (n - 1)) / n
        return values.map((v, i) => {
          const k = rise(p * (n * 0.25 + 1), i * 0.25, 1), bh = (v / max) * h * k, bx = x + i * (bw + gap)
          return '<rect x="' + bx + '" y="' + (y - bh) + '" width="' + bw + '" height="' + bh + '" rx="' + Math.min(10, bw / 6) +
            '" fill="' + colors[i % colors.length] + '"/>' +
            (labels[i] != null ? '<text x="' + (bx + bw / 2) + '" y="' + (y + 30) + '" text-anchor="middle" font-size="' + Math.round(61 * 0.3) +
              '" fill="' + C.muted + '" font-family="' + FONT.replace(/"/g, '') + '">' + esc(labels[i]) + '</text>' : '')
        }).join('')
      }

      // A waffle: n squares in rows of cols, revealed in order with p; the
      // first lit of them light up in order with litP
      function waffle({ x = PAD, y = H * 0.45, w = SAFE_RIGHT - PAD, n = 100, cols = 10, lit = 0, color = C.accent, p = 1, litP = 1 } = {}) {
        const step = w / cols, size = step * 0.84
        const on = Math.round(lit * clamp(litP))
        let out = ''
        for (let k = 0; k < n; k++) {
          const show = clamp(p * n - k)
          if (show <= 0) break
          out += '<rect x="' + (x + (k % cols) * step) + '" y="' + (y + Math.floor(k / cols) * step) + '" width="' + size + '" height="' + size +
            '" rx="' + size * 0.18 + '" fill="' + (k < on ? color : C.panel) + '" stroke="' + C.line + '" opacity="' + show + '"/>'
        }
        return out
      }

      // The starter title card, until a shot gets its own design
      function card(t, { kicker, title, body, progress }) {
        stage('')
        frame({ kicker, head: title.replace(/<\/?b>/g, '*'), typed: rise(t, 0.1, 0.6), sub: body, subIn: rise(t, 0.6), progress })
      }

      window.kit = { $, W, H, PAD, SAFE_TOP, SAFE_RIGHT, SAFE_BOTTOM, C, FONT, HEAD_FONT, clamp, lerp, ease, rise, pop, stagger, hold, float, readTime, hash, waffle,
        frame, stage, view, set, drawOn, count, arrow, bars, card }

      const uiLayer = document.createElement('div')
      uiLayer.id = 'ui'
      document.body.appendChild(uiLayer)
      let uiParts = []
      const uiAdd = html => { uiParts.push(html); uiLayer.innerHTML = uiParts.join('') }
      const baseStage = stage
      stage = markup => { uiParts = []; uiLayer.innerHTML = ''; return baseStage(markup) }
      const time = '9:41'
      function phone({ x, y, w = 300, screen = '', dark = false, p = 1, tilt = 0 } = {}) {
        const h = w * 2.05
        uiAdd('<div class="dev" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;opacity:' + clamp(p * 1.5) +
          ';transform:translateY(' + (1 - ease(p)) * 60 + 'px) rotate(' + tilt + 'deg)"><div class="notch"></div><div class="scr ' + (dark ? 'd' : 'l') + '"><div class="sb"><span>' + time + '</span><span>●●● ▮</span></div>' + screen + '</div></div>')
      }
      function browser({ x, y, w = 600, h = 400, url = '', screen = '', dark = false, p = 1 } = {}) {
        uiAdd('<div class="win" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;opacity:' + clamp(p * 1.5) + ';transform:translateY(' + (1 - ease(p)) * 40 + 'px)">' +
          '<div class="bar"><i></i><i></i><i></i><span>' + esc(url) + '</span></div><div class="scr ' + (dark ? 'd' : 'l') + '" style="background:' + (dark ? '#101114' : '#fff') + '">' + screen + '</div></div>')
      }
      const appBar = (title, { back = false } = {}) => '<div class="ab">' + (back ? '‹ ' : '') + esc(title) + '</div>'
      const msg = ({ text, me = false, p = 1, time: tm } = {}) => p <= 0 ? '' : '<div class="bub' + (me ? ' me' : '') + '" style="opacity:' + clamp(p * 2) + ';transform:translateY(' + (1 - ease(p)) * 14 + 'px) scale(' + (0.9 + 0.1 * ease(p)) + ')">' + esc(text) + (tm ? '<div style="font-size:11px;opacity:.6;margin-top:3px">' + esc(tm) + '</div>' : '') + '</div>'
      const notif = ({ app, title, body, p = 1 } = {}) => p <= 0 ? '' : '<div class="ntf" style="opacity:' + clamp(p * 2) + ';transform:translateY(' + (ease(p) - 1) * 60 + 'px)"><small>' + esc(app) + ' · now</small><b>' + esc(title) + '</b>' + esc(body) + '</div>'
      const button = (label, { primary = true, pressed = 0 } = {}) => '<div class="btn' + (primary ? ' pri' : '') + '" style="transform:scale(' + (1 - 0.05 * clamp(pressed)) + ')">' + esc(label) + '</div>'
      const field = (label, value, { typed = 1 } = {}) => '<div class="fld"><small>' + esc(label) + '</small>' + esc(String(value).slice(0, Math.round(String(value).length * clamp(typed)))) + (typed < 1 ? '|' : '') + '</div>'
      const row = ({ title, sub = '', icon = '' } = {}) => '<div class="row"><div class="ic">' + esc(icon) + '</div><div>' + esc(title) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div></div>'
      const toast = (text, p = 1) => p <= 0 ? '' : '<div class="tst" style="opacity:' + clamp(p * 2) + '">' + esc(text) + '</div>'
      function tap(x, y, p, { color = C.accent } = {}) {
        if (p <= 0 || p >= 1.6) return
        const r = 14 + 40 * clamp(p)
        uiAdd('<div class="tap" style="left:' + (x - r) + 'px;top:' + (y - r) + 'px;width:' + r * 2 + 'px;height:' + r * 2 + 'px;border:3px solid ' + color + ';opacity:' + (1 - clamp(p)) + '"></div>' +
          '<div class="tap" style="left:' + (x - 16) + 'px;top:' + (y - 16) + 'px;width:32px;height:32px;background:' + color + ';opacity:' + 0.55 * (1 - clamp(p - 0.6)) + '"></div>')
      }
      Object.assign(window.kit, { stage, phone, browser, appBar, msg, notif, button, field, row, toast, tap })
      window.ready = document.fonts.ready
    </script>
  </body>
</html>
