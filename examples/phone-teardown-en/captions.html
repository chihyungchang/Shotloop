<!doctype html>
<!-- Caption layer: transparent, drawn over every frame. render(t) is film time.
     720×1280 CSS px; text stays in the top third, clear of the bottom 18%. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 720px; height: 1280px; overflow: hidden; background: transparent; }
      body { font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #f5f5f7; -webkit-font-smoothing: antialiased; }
      .card { position: absolute; left: 48px; right: 48px; top: 150px; text-align: center; }
      .kicker { font-size: 21px; font-weight: 500; letter-spacing: 0.18em; color: #ff9f5a; margin-bottom: 18px; }
      .title { font-size: 60px; font-weight: 600; line-height: 1.16; letter-spacing: 0.01em; }
      .title.big { font-size: 72px; }
      .sub { margin-top: 20px; font-size: 29px; font-weight: 400; line-height: 1.45; color: #a1a1a6; }
      .rule { width: 0; height: 3px; margin: 22px auto 0; border-radius: 2px; background: #ff9f5a; }
      #end { top: 190px; }
      #end .title { font-size: 64px; letter-spacing: 0.02em; }
    </style>
  </head>
  <body>
    <div id="layer"></div>
    <script>
      // [film time in, film time out, kicker, title, sub, extra class]
      const CARDS = [
        [0.25, 3.35, '', 'What’s inside<br>a phone?', '', 'big'],
        [4.1, 7.85, 'EXPLODED VIEW', 'Layer on layer', 'Most phones are under 1 cm thick', ''],
        [8.2, 11.4, '01 · SCREEN', 'Screen (OLED)', 'Each pixel lights itself: no backlight', ''],
        [11.75, 15.4, '02 · MAINBOARD', 'Mainboard and chips', 'Processor, memory and storage chips,<br>all on this one board', ''],
        [15.75, 18.0, '03 · BATTERY', 'The battery', 'It takes up a large share of the body', ''],
        [18.4, 19.9, '04 · CAMERA', 'Camera module', 'Each rear camera has its own<br>lens and sensor', ''],
        [20.25, 21.85, '', 'Close it up, and it’s a phone', '', ''],
        [22.1, 24.5, '', 'Shotloop example', 'A short film made one shot at a time', 'end']
      ]
      const clamp = x => Math.min(1, Math.max(0, x))
      const easeOut = x => 1 - Math.pow(1 - clamp(x), 3)
      const layer = document.getElementById('layer')
      const els = CARDS.map(([, , kicker, title, sub, cls]) => {
        const el = document.createElement('div')
        el.className = 'card'
        if (cls === 'end') el.id = 'end'
        el.innerHTML = (kicker ? `<div class="kicker">${kicker}</div>` : '') +
          `<div class="title ${cls === 'big' ? 'big' : ''}">${title}</div>` +
          (sub ? `<div class="sub">${sub}</div>` : '') + (cls === 'end' ? '<div class="rule"></div>' : '')
        layer.appendChild(el)
        return el
      })
      window.render = t => {
        CARDS.forEach(([a, b], i) => {
          const el = els[i]
          const fadeIn = easeOut((t - a) / 0.55)
          const fadeOut = clamp((b - t) / 0.3)
          const o = Math.min(fadeIn, fadeOut)
          el.style.opacity = o
          el.style.transform = `translateY(${(1 - fadeIn) * 18}px)`
          el.style.display = o > 0 ? 'block' : 'none'
          const sub = el.querySelector('.sub')
          if (sub) sub.style.opacity = easeOut((t - a - 0.25) / 0.55)
          const rule = el.querySelector('.rule')
          if (rule) rule.style.width = `${easeOut((t - a - 0.3) / 0.7) * 120}px`
        })
      }
      window.ready = document.fonts.ready
      render(0)
    </script>
  </body>
</html>
